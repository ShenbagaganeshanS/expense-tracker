<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>Expense Tracker</h1>

    <h2>Add / Update Expense</h2>
    <form id="expenseForm">
        <input type="text" name="expense_id" placeholder="Expense ID" required>
        <input type="date" name="date" required>
        <input type="text" name="category" placeholder="Category" required>
        <input type="number" name="amount" placeholder="Amount" required>
        <input type="text" name="description" placeholder="Description">
        <input type="text" name="payment_mode" placeholder="Payment Mode">
        <input type="text" name="merchant_name" placeholder="Merchant Name">
        <input type="text" name="location" placeholder="Location">
        <input type="text" name="notes" placeholder="Notes">
        <input type="text" name="created_by" placeholder="Created By">
        <button type="submit">Save Expense</button>
    </form>

    <h2>All Expenses</h2>
    <ul id="expensesList"></ul>

    <div class="summary-buttons">
        <button onclick="downloadSummary('excel')">Download Excel</button>
        <button onclick="downloadSummary('pdf')">Download PDF</button>
    </div>
</div>

<script>
const form = document.getElementById("expenseForm");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form));

    const check = await fetch(`/expenses/${data.expense_id}`);
    const method = check.status === 200 ? "PUT" : "POST";

    const url = method === "PUT" 
        ? `/expenses/${data.expense_id}` 
        : "/expenses";

    await fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });

    form.reset();
    loadExpenses();
});

async function loadExpenses() {
    const res = await fetch("/expenses");
    const expenses = await res.json();
    const list = document.getElementById("expensesList");
    list.innerHTML = "";

    expenses.filter(e => e.expense_id).forEach(exp => {
        const li = document.createElement("li");
        li.innerHTML = `
            <span>${exp.expense_id}</span>
            <span>${exp.category}</span>
            <span>₹${exp.amount}</span>
            <span>${exp.date}</span>
            <button class="delete-btn" onclick="deleteExpense('${exp.expense_id}')">Delete</button>
        `;
        list.appendChild(li);
    });
}

async function deleteExpense(id) {
    if (!confirm("Delete this expense?")) return;
    await fetch(`/expenses/${id}`, { method: "DELETE" });
    loadExpenses();
}

function downloadSummary(format) {
    window.location.href = `/expenses/summary?format=${format}`;
}

loadExpenses();
</script>

</body>
</html>
